# Builds the static app and publishes it to GitHub Pages.
# Live at https://vesagalica.github.io/KnitBit/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# Minimum rights needed to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels a run that is still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Nothing is published if a test fails.
      - run: npm test

      # The site is served from /KnitBit/, not from the domain root.
      - run: npm run build
        env:
          NUXT_APP_BASE_URL: /KnitBit/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
