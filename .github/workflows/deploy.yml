# Builds the static app and publishes it to GitHub Pages.
# Live at https://vesagalica.github.io/KnitBit/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# Minimum rights needed to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels a run that is still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm install instead of npm ci: the lock file is written on Windows,
      # where npm leaves out optional packages that only Linux needs
      # (@emnapi/core, @emnapi/runtime for a WebAssembly fallback). npm ci on
      # the Linux runner rejects that lock file as "out of sync"; npm install
      # adds the missing packages and keeps every other version from the lock.
      - run: npm install --no-audit --no-fund

      # Nothing is published if a test fails.
      - run: npm test

      # The site is served from /KnitBit/, not from the domain root.
      - run: npm run build
        env:
          NUXT_APP_BASE_URL: /KnitBit/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
